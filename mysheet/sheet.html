<input type="hidden" class="sheet-tabstoggle" name="attr_sheetTab"  value="main"  />
<div>
    <button type="action" name="act_main" >Main</button>
    <button type="action" name="act_combat" >Combat</button>
    <button type="action" name="act_advances" >Advances</button>

</div>




<div class="sheet-main">
    <div class="mysheet">
    <div class="maindiv">
        <section class="tokenpic">
            <img alt="Character Avatar" name="attr_character_avatar" style="width:auto;height: auto; bottom: 0;"/>
        </section>

        <section class="name">
            <div class="charname">
                <h2><span name="attr_character_name"></span></h2>
            </div>

            <div class="originstitle">
                <h4>Origin</h4>
            </div>
            <div class="originsvalue">
                <h4><span name="attr_origin"></span></h4>
            </div>

            <div class="careertitle">
                <h4>Career</h4>
            </div>
            <div class="careervalue">
                <h4><span name="attr_career"></span></h4>
            </div>

            <div class="statustitle">
                <h4>Status</h4>
            </div>
            <div class="statusvalue">
                <h4><span name="attr_status"></span></h4>
            </div>

        </section>

        <section class="stats1">

            <div class="wstitle">
                <h3>WS</h3>
            </div>
            <div class="wsvalue">
                <h3><span name="attr_wsTotal"></span></h3>
            </div>
            <div class="wsname">
                <h4>Weapon Skill</h4>
            </div>
            <div class="meleename">
                <h4>Melee</h4>
            </div>
            <div class="meleevalue">
                <h4><span name="attr_meleeTotal"></span></h4>
            </div>
            <div class="defencename">
                <h4>Defence</h4>
            </div>
            <div class="defencevalue">
                <h4><span name="attr_defenceTotal"></span></h4>
            </div>







        </section>

        <section class="stats2">
            Stats2
        </section>



        <section class="condition">
            
            <div class="fatetitle">
                <h4>Fate</h4>
            </div>
            <div class="currentfatetitle">
                <h4>Current</h4>
            </div>
            <div class="currentfate">
                <h4><span name="attr_fate"></span></h4>
            </div>
            <div class="maxfatetitle">
                <h4>Max</h4>
            </div>
            <div class="maxfate">
                <h4><span name="attr_fate_max"></span></h4>
            </div>

            <div class="conditionstitle">
                <h4>Current Condition</h4>
            </div>
            <div class="conditionsdisplay">
                <span name="attr_conditionsDisplay"></span>
            </div>
        </section>

    </div>
    </div>
</div>


<div class="sheet-combat">
COMBAT



</div>

<div class="sheet-advances">
Advances



</div>








<script type="text/worker">
    const buttonlist = ["main","combat","advances"];
    buttonlist.forEach(button => {
        on(`clicked:${button}`, function() {
            setAttrs({
                sheetTab: button
            });
        });
    });
    on("sheet:opened", function() {
        setAttrs({sheetTab:"main"});
    });

    //on change of currentCondition needs update
    //same with current fate points




</script>
