<input type="hidden" class="sheet-tabstoggle" name="attr_sheetTab"  value="main"  />
<div>
    <button type="action" name="act_main" >Main</button>
    <button type="action" name="act_combat" >Combat</button>
</div>




<div class="sheet-main">
    <div class="mysheet">
    <main>


        <section class="tokenpic">
            <img alt="Character Avatar" name="attr_character_avatar" style="width:auto;height:190px; bottom: 0;"/>
        </section>

        <section class="name">
                <h2><span name="attr_character_name"></span></h2>
                <div class="origins">
                    <h4>Origin: <span name="attr_origin"></span>  Career: <span name="attr_career"></span>  Status: <span name="attr_status"></span></h4>
                </div>
        </section>

        <section class="stats">
            Stats
        </section>

        <section class="fate">
            Fate
        </section>

        <section class="talents">
            Talents
        </section>

        <section class="lores">
            Lores
        </section>


    </main>
    </div>
</div>


<div class="sheet-combat">
COMBAT



</div>










<script type="text/worker">
    const buttonlist = ["main","combat"];
    buttonlist.forEach(button => {
        on(`clicked:${button}`, function() {
            setAttrs({
                sheetTab: button
            });
        });
    });
    on("sheet:opened", function() {
        setAttrs({sheetTab:"main"});
    });


</script>
